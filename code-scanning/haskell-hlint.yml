# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: "Scan code with HLint"

on:
  push:
    branches: [ $default-branch, $protected-branches ]

  pull_request:
    # The branches below must be a subset of the branches above.
    branches: [ $default-branch ]

jobs:
  hlint:
    runs-on: ubuntu-latest
    permissions:
      # Needed to read the code for scanning.
      actions: read
      contents: read
      # Needed to upload analysis results to GitHub code scanning.
      security-events: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Scan code and upload results"
        uses: haskell-actions/hlint-scan@haskell-actions/hlint-scan@3e2feb228d5d90db9ba2bb93c720d83e4c06681c # v1.2.0
